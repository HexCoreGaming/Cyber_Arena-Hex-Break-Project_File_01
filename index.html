==============================================================================================================
PROJECT OVERVIEW
==============================================================================================================

project Cyber_Arena_HEX_BREAK {

    title = "Cyber_Arena HEX//BREAK"
    genre = "Fast, skill-based arena FPS"
    engine = "Unreal Engine"
    development = "Blueprint-focused"
    primary_mode = "HEX//BREAK"

    overview {

        Cyber_Arena HEX//BREAK is a fast, skill-based arena FPS built around extreme movement,
        local-gravity traversal, and the HEX//BREAK objective mode.

        The game blends cyberpunk technology, fantasy, medieval influences, magical energy,
        gladiatorial aesthetics, and cosmic science fiction into a competitive arena setting
        where Human and Elven gladiators fight for the entertainment of massive cosmic beings.

        Cyber_Arena HEX//BREAK is being built in Unreal Engine as a Blueprint-focused project,
        with a strong emphasis on player skill rather than automated assistance.

    }

    skill_philosophy {

        aim_assist = DISABLED
        auto_kill = DISABLED
        poor_aim_reward = DISABLED
        poor_movement_reward = DISABLED

        core_rule {

            Mastering movement, positioning, weapons, gadgets, abilities,
            personal gravity, objective strategy, and the arena itself
            should determine who wins.

        }

    }

}

    }

    civilization {

        The world represents a fantasy civilization that has effectively

    }

    arena_purpose {

        The arenas exist primarily as entertainment for cosmic beings and spectators,
        giving matches a futuristic gladiator-sport feeling.

    }

    presentation {

        crowds
        announcers
        cosmic_entities
        space_battles
        planets
        nebulae
        asteroids
        strange_lifeforms

    }

}


==============================================================================================================
CORE MOVEMENT PHILOSOPHY
==============================================================================================================

movement {

    Movement is one of the defining features of Cyber_Arena HEX//BREAK.

    Players move extremely quickly and are intended to chain movement together aggressively
    rather than slowly navigate traditional FPS maps.

    base_movement {

        high_speed_running
        jumping
        crouching
        sliding
        vaulting
        mantling
        wall_running
        upward_wall_climbing
        wall_jumping
        wall_top_mantling
        movement_gadgets

    }

    standard_sprint = REMOVED

    Base movement is substantially faster instead.

    possible_future_sprint_gadget = TRUE

}


==============================================================================================================
PERSONAL GRAVITY / EVERY-SURFACE MOVEMENT
==============================================================================================================

personal_gravity {

    type = "Surface-relative gravity"

    universal_world_up = FALSE

    orientation_sequence {

        Current_Floor_Surface
            |
            v
        Surface_Normal
            |
            v
        Personal_Gravity
            |
            v
        Character_Orientation
            |
            v
        Camera_Orientation

    }

    normal_floor {

        floor = DOWN

    }

    wall {

        wall = DOWN

    }

    ceiling {

        ceiling = DOWN

    }

    player_perspective {

        The player always experiences their registered surface as down.

    }

    multiplayer_example {

        player_A = "Standing on floor"
        player_B = "Running on vertical wall"
        player_C = "Running upside down across ceiling"

        All three players experience their own surface as down.

    }

    attachment {

        continuous_button_required = FALSE
        automatic_attachment_after_valid_contact = TRUE

    }

    surface_change {

        A player must leave the current surface and physically contact another valid surface.

        Simply passing near another wall does not change gravity.

    }

    transfer {

        Player_leaves_Surface_A
            |
            v
        Surface_A_gravity_remains_active
            |
            v
        Player_travels_through_space
            |
            v
        Player_contacts_Surface_B
            |
            v
        Surface_B_becomes_new_floor

    }

    missed_surface {

        If the player misses every surface, they continue falling according to the
        gravity orientation of their previous surface.

        automatic_world_down_reset = FALSE

    }

    curved_surfaces {

        continuous_surface_normal_update = TRUE

        examples {

            spheres
            curved_tunnels
            rounded_tracks
            continuous_loops

        }

    }

    hard_edges {

        automatic_corner_wrapping = FALSE

        A cube does not automatically pull the player around its corners.

    }

}

</script>


<script>

/* ========================================================= */
/* SOURCE                                                    */
/* ========================================================= */

const sourceElement =
    document.getElementById("source");

const codeElement =
    document.getElementById("code");

const skipButton =
    document.getElementById("skip");

const statusElement =
    document.getElementById("status");

const source =
    sourceElement
        .textContent
        .replace(/^\n/, "");


let index = 0;

let finished = false;

let timer = null;


/* ========================================================= */
/* HTML SAFETY                                               */
/* ========================================================= */

function escapeHtml(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* ========================================================= */
/* HEXCORE SYNTAX CLASSIFIER                                 */
/* ========================================================= */

function classifyLine(line) {

    const trimmed =
        line.trim();


    if (
        trimmed === "CYBER_ARENA"
    ) {

        return "mega-title";

    }


    if (
        trimmed === "HEX//BREAK"
    ) {

        return "mega-mode";

    }


    if (
        trimmed === "WELCOME TO THE ARENA"
    ) {

        return "mega-ending";

    }


    if (
        trimmed.startsWith("====")
    ) {

        return "divider";

    }


    if (
        trimmed.startsWith("//")
    ) {

        return "comment";

    }


    if (
        trimmed.endsWith("{") ||
        trimmed === "}"
    ) {

        return "subsection";

    }


    if (
        trimmed.includes("=") &&
        !trimmed.startsWith("====")
    ) {

        if (
            trimmed.includes("TRUE") ||
            trimmed.includes("FALSE") ||
            trimmed.includes("ENABLED") ||
            trimmed.includes("DISABLED") ||
            trimmed.includes("FREE")
        ) {

            return "boolean";

        }

        return "key";

    }


    if (
        /^[A-Z0-9][A-Z0-9 \/&\-']+$/.test(trimmed) &&
        trimmed.length > 0 &&
        trimmed.length < 100
    ) {

        return "section";

    }


    return "normal";

}


/* ========================================================= */
/* RENDER                                                    */
/* ========================================================= */

function render(
    text,
    showCursor = true
) {

    const lines =
        text.split("\n");


    codeElement.innerHTML =
        lines
            .map(
                (line) => {

                    const type =
                        classifyLine(line);

                    const safe =
                        escapeHtml(line);

                    return (
                        '<span class="line ' +
                        type +
                        '">' +
                        safe +
                        '</span>'
                    );

                }
            )
            .join("");


    if (showCursor) {

        const cursorLine =
            document.createElement("span");

        cursorLine.className =
            "line";


        const cursor =
            document.createElement("span");

        cursor.id =
            "cursor";

        cursor.textContent =
            "|";


        cursorLine.appendChild(
            cursor
        );

        codeElement.appendChild(
            cursorLine
        );

    }

}


/* ========================================================= */
/* TYPE EFFECT                                               */
/* ========================================================= */

function typingStep() {

    if (finished) {

        return;

    }


    if (
        index >= source.length
    ) {

        finishTyping();

        return;

    }


    /*
        Original version used 9 characters per step.

        This uses 8.

        That makes the visible typing roughly 10 percent slower
        than the original version you liked.
    */

    let chunkSize = 8;


    if (
        source[index] === "\n"
    ) {

        chunkSize = 1;

    }


    index =
        Math.min(
            index + chunkSize,
            source.length
        );


    render(
        source.slice(
            0,
            index
        ),
        true
    );


    /*
        IMPORTANT:

        There is deliberately NO window.scrollTo() here.

        The project file continues typing independently
        without moving the visitor's screen.
    */

    timer =
        setTimeout(
            typingStep,
            4
        );

}


/* ========================================================= */
/* FINISH                                                    */
/* ========================================================= */

function finishTyping() {

    finished = true;


    if (timer) {

        clearTimeout(timer);

    }


    index =
        source.length;


    render(
        source,
        false
    );


    statusElement.textContent =
        "HEXCORE GAMING // PROJECT FILE LOADED";


    skipButton.textContent =
        "FILE LOADED";


    skipButton.disabled =
        true;

}


/* ========================================================= */
/* SKIP                                                      */
/* ========================================================= */

skipButton.addEventListener(
    "click",
    finishTyping
);


/* ========================================================= */
/* INITIALIZE                                                */
/* ========================================================= */

render(
    "",
    true
);


setTimeout(
    () => {

        statusElement.textContent =
            "HEXCORE GAMING // LOADING CYBER_ARENA HEX//BREAK...";


        typingStep();

    },
    450
);

</script>
