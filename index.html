==============================================================================================================
PROJECT OVERVIEW
==============================================================================================================

project Cyber_Arena_HEX_BREAK {

    title = "Cyber_Arena HEX//BREAK"

    genre = "Fast, skill-based arena FPS"

    engine = "Unreal Engine"

    development_style = "Blueprint-focused"

    primary_mode = "HEX//BREAK"


    overview {

        Cyber_Arena HEX//BREAK is a fast, skill-based arena FPS built around
        extreme movement, local-gravity traversal, and the HEX//BREAK objective mode.

        The game blends cyberpunk technology, fantasy, medieval influences,
        magical energy, gladiatorial aesthetics, and cosmic science fiction
        into a competitive arena setting.

        Human and Elven gladiators fight inside futuristic arenas for the
        entertainment of massive cosmic beings and spectators.

        The game is being built in Unreal Engine as a Blueprint-focused project.

        Player skill is prioritized over automated assistance.

    }


    skill_philosophy {

        aim_assist = DISABLED

        auto_kill = DISABLED

        poor_aim_reward = DISABLED

        poor_movement_reward = DISABLED


        victory_should_be_determined_by {

            movement
            positioning
            weapons
            gadgets
            abilities
            personal_gravity
            objective_control
            arena_knowledge
            timing
            decision_making
            execution

        }


        rule {

            The player who better masters the game's systems
            should have the advantage.

            The game should not play itself for the player.

        }

    }

}

==============================================================================================================
CORE MOVEMENT PHILOSOPHY
==============================================================================================================

movement {

    Movement is one of the defining features of Cyber_Arena HEX//BREAK.

    Players move extremely quickly.

    The game is intended to reward aggressively chaining movement
    instead of slowly navigating traditional FPS maps.


    base_movement {

        high_speed_running
        jumping
        crouching
        sliding
        vaulting
        mantling
        wall_running
        upward_wall_climbing
        wall_jumping
        wall_top_mantling
        movement_gadgets

    }


    standard_sprint = REMOVED


    sprint_rule {

        Base movement is substantially faster instead.

        Speed is part of the normal movement language.

        Sprint may eventually return as an optional movement gadget.

    }

}


==============================================================================================================
PERSONAL GRAVITY / EVERY-SURFACE MOVEMENT
==============================================================================================================

personal_gravity {

    system_type = "Surface-relative personal gravity"

    universal_world_up = FALSE


    gravity_sequence {

        Current_Floor_Surface
            |
            v
        Surface_Normal
            |
            v
        Personal_Gravity
            |
            v
        Character_Orientation
            |
            v
        Camera_Orientation

    }


    normal_floor {

        floor = DOWN

    }


    wall {

        wall = DOWN

    }


    ceiling {

        ceiling = DOWN

    }


    player_perspective {

        From the player's perspective, they remain upright.

    }


    multiplayer_example {

        player_A = "Standing on a normal floor"

        player_B = "Running normally on a vertical wall"

        player_C = "Running upside down across the ceiling"

        result = "All three experience their own surface as down"

    }


    attachment {

        continuous_button_required = FALSE

        attachment_persists_after_valid_contact = TRUE

    }


    changing_surfaces {

        step_01 = "Leave current surface"

        step_02 = "Travel away from current surface"

        step_03 = "Physically contact another valid surface"

        passing_near_another_surface_changes_gravity = FALSE

    }


    transfer_example {

        Player_leaves_Surface_A
            |
            v
        Surface_A_gravity_remains_active
            |
            v
        Player_travels_through_space
            |
            v
        Player_contacts_Surface_B
            |
            v
        Surface_B_becomes_new_floor

    }


    missed_surface {

        If the player misses every surface, they continue falling
        according to their previous gravity frame.

        automatic_world_down_reset = FALSE

    }


    curved_surfaces {

        continuous_surface_normal_update = TRUE

        examples {

            spheres
            curved_tunnels
            rounded_tracks
            continuous_loops

        }

    }


    hard_edges {

        automatic_corner_wrapping = FALSE

        A cube does not automatically pull the player around corners.

    }

}

/* ========================================================= */
/* 0 / 1 LETTER BUILDER                                      */
/* ========================================================= */

/*
    IMPORTANT:

    The FONT patterns above only define SHAPE.

    0 in a FONT pattern means EMPTY SPACE.

    1 in a FONT pattern means DRAW SOMETHING.

    When a pixel is drawn, it is replaced with either:

        00

    or:

        11

    This means the actual visible title is physically
    constructed out of 0 and 1 characters.

    The invisible parts remain blank spaces.
*/

function makeBinaryBanner(text) {

    text =
        text.toUpperCase();


    const rows = [
        "",
        "",
        "",
        "",
        "",
        "",
        ""
    ];


    for (
        let characterIndex = 0;
        characterIndex < text.length;
        characterIndex++
    ) {

        const character =
            text[characterIndex];


        const glyph =
            FONT[character] ||
            FONT[" "];


        for (
            let row = 0;
            row < 7;
            row++
        ) {

            for (
                let column = 0;
                column < glyph[row].length;
                column++
            ) {

                const pixel =
                    glyph[row][column];


                if (
                    pixel === "1"
                ) {

                    const useOne =
                        (
                            row +
                            column +
                            characterIndex
                        ) % 2 === 0;


                    rows[row] +=
                        useOne
                            ? "11"
                            : "00";

                }

                else {

                    rows[row] +=
                        "  ";

                }

            }


            rows[row] +=
                "    ";

        }

    }


    return rows.join("\n");

}

*/

const CHARACTERS_PER_SECOND =
    700;


const FRAME_DELAY =
    25;


const CHARS_PER_FRAME =
    Math.max(
        1,
        Math.round(
            CHARACTERS_PER_SECOND *
            FRAME_DELAY /
            1000
        )
    );


let index = 0;

let timer = null;

let finished = false;


/* ========================================================= */
/* HTML ESCAPE                                               */
/* ========================================================= */

function escapeHtml(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* ========================================================= */
/* LINE COLOR CLASSIFIER                                     */
/* ========================================================= */

function classifyLine(line) {

    const trimmed =
        line.trim();


    /*
        Detect binary-art lines.

        These lines contain only:
        0
        1
        spaces
    */

    if (
        trimmed.length >= 2 &&
        /^[01 ]+$/.test(trimmed)
    ) {

        return "binary";

    }


    if (
        trimmed.startsWith("====")
    ) {

        return "divider";

    }


    if (
        trimmed.startsWith("//")
    ) {

        return "comment";

    }


    if (
        trimmed.endsWith("{") ||
        trimmed === "}"
    ) {

        return "subsection";

    }


    if (
        trimmed.includes("=") &&
        !trimmed.startsWith("====")
    ) {

        if (
            trimmed.includes("TRUE") ||
            trimmed.includes("FALSE") ||
            trimmed.includes("DISABLED") ||
            trimmed.includes("ENABLED") ||
            trimmed.includes("FREE")
        ) {

            return "boolean";

        }


        return "key";

    }


    if (
        /^[A-Z0-9_ \/&\-']+$/
            .test(trimmed) &&
        trimmed.length > 0 &&
        trimmed.length < 100
    ) {

        return "section";

    }


    return "normal";

}


/* ========================================================= */
/* RENDER                                                    */
/* ========================================================= */

function render(
    text,
    showCursor
) {

    const lines =
        text.split("\n");


    codeElement.innerHTML =

        lines

            .map(
                (line) => {

                    const className =
                        classifyLine(line);


                    return (

                        '<span class="line ' +
                        className +
                        '">' +

                        escapeHtml(line) +

                        '</span>'

                    );

                }
            )

            .join("");


    if (showCursor) {

        const cursorLine =
            document.createElement(
                "span"
            );


        cursorLine.className =
            "line";


        const cursor =
            document.createElement(
                "span"
            );


        cursor.id =
            "cursor";


        cursor.textContent =
            "|";


        cursorLine.appendChild(
            cursor
        );


        codeElement.appendChild(
            cursorLine
        );

    }

}


/* ========================================================= */
/* TYPING                                                    */
/* ========================================================= */

function typingStep() {

    if (finished) {

        return;

    }


    if (
        index >=
        fullSource.length
    ) {

        finishTyping();

        return;

    }


    index =
        Math.min(

            index +
            CHARS_PER_FRAME,

            fullSource.length

        );


    render(

        fullSource.slice(
            0,
            index
        ),

        true

    );


    /*
        NO AUTO SCROLL.

        Nothing in this function moves the page.

        The visitor can remain anywhere they want
        while the file continues writing.
    */


    timer =
        setTimeout(
            typingStep,
            FRAME_DELAY
        );

}


/* ========================================================= */
/* FINISH                                                    */
/* ========================================================= */

function finishTyping() {

    finished = true;


    if (timer) {

        clearTimeout(
            timer

    }


    index =
        fullSource.length;


    render(
        fullSource,
        false
    );


    statusElement.textContent =
        "HEXCORE GAMING // PROJECT FILE LOADED";


    skipButton.textContent =
        "FILE LOADED";


    skipButton.disabled =
        true;

}
