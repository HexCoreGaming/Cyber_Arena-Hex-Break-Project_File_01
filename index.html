========================================================================================================================
PROJECT OVERVIEW
========================================================================================================================

project Cyber_Arena_HEX_BREAK {

    title = "Cyber_Arena HEX//BREAK"
    genre = "Fast, skill-based arena FPS"
    engine = "Unreal Engine"
    development_style = "Blueprint-focused"
    primary_mode = "HEX//BREAK"

    overview {

        Cyber_Arena HEX//BREAK is a fast, skill-based arena FPS built around extreme movement,
        local-gravity traversal, and the HEX//BREAK objective mode.

        The game blends cyberpunk technology, fantasy, medieval influences, and cosmic sci-fi
        into a competitive arena setting where Human and Elven gladiators fight for the
        entertainment of massive cosmic beings.

        The project is being built in Unreal Engine as a Blueprint-focused game with a strong
        emphasis on player skill rather than automated assistance.

        There is no aim assist, no auto-kill system, and no mechanic intended to reward
        poor aim or poor movement.

        The core idea is that mastering movement, positioning, weapons, gadgets, abilities,
        personal gravity, objective strategy, and the arena itself should determine who wins.

    }

    skill_philosophy {

        aim_assist = DISABLED
        auto_kill_system = DISABLED
        poor_aim_assistance = DISABLED
        poor_movement_assistance = DISABLED

        mastery_matters {

            aim
            movement
            positioning
            timing
            decision_making
            arena_knowledge
            execution
            objective_control

        }

    }

}

========================================================================================================================
CORE MOVEMENT PHILOSOPHY
========================================================================================================================

movement_core {

    movement_speed = HIGH
    standard_sprint = REMOVED
    chained_movement = ENCOURAGED
    traditional_fps_pacing = REJECTED

    philosophy {

        Movement is one of the defining features of Cyber_Arena HEX//BREAK.

        Players move extremely quickly and are intended to chain movement together aggressively
        rather than slowly navigate traditional FPS maps.

        The game is built around maintaining momentum while:

            attacking
            escaping
            pursuing
            intercepting
            repositioning
            defending
            chasing_the_hexcore

    }

    base_movement {

        high_speed_running
        jumping
        crouching
        sliding
        vaulting
        mantling
        wall_running
        upward_wall_climbing
        wall_jumping
        wall_top_mantling
        movement_gadgets

    }

    future_optional_sprint_gadget = POSSIBLE

}

========================================================================================================================
PERSONAL GRAVITY / EVERY-SURFACE MOVEMENT
========================================================================================================================

personal_gravity_system {

    type = "Surface-relative personal gravity"
    world_up = "Not universal"

    concept_sequence {

        Current_Floor_Surface
            |
            v
        Surface_Normal
            |
            v
        Personal_Gravity
            |
            v
        Character_Orientation
            |
            v
        Camera_Orientation

    }

    examples {

        floor = "Acts as down"
        wall = "Can become down"
        ceiling = "Can become down"

    }

    multiplayer_example {

        player_A = "Standing on a floor"
        player_B = "Running on a vertical wall"
        player_C = "Running upside down across the ceiling"

        result = "All three experience their own surface as down"

    }

    attachment {

        hold_button_required = FALSE
        persists_automatically_after_valid_contact = TRUE

    }

    surface_change_rule {

        leave_surface_A
        travel_through_space
        contact_surface_B
        surface_B_becomes_new_floor

        passing_near_surface_does_not_change_gravity = TRUE

    }

    missed_surface_behavior {

        If the player misses everything, they continue falling according to
        their previous gravity frame instead of snapping back to world-down.

    }

    curved_surfaces {

        surface_normal_can_update_continuously = TRUE

        valid_examples {

            spheres
            curved_tunnels
            rounded_tracks
            continuous_loops

        }

    }

    hard_edges {

        automatic_corner_wrapping = FALSE

        A cube does not automatically pull the player around corners.

    }

}

<script>
const sourceElement = document.getElementById("source");
const codeElement = document.getElementById("code");
const skipButton = document.getElementById("skip");
const statusElement = document.getElementById("status");

const source = sourceElement.textContent.replace(/^\n/, "");
const totalDurationMs = 5000;
const stepDelayMs = 10;
const totalSteps = Math.max(1, Math.floor(totalDurationMs / stepDelayMs));
const charsPerStep = Math.max(12, Math.ceil(source.length / totalSteps));

let index = 0;
let finished = false;
let timer = null;

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function classifyLine(line) {
    const trimmed = line.trim();

    if (
        trimmed.startsWith("===") ||
        trimmed === "HEX//BREAK" ||
        trimmed === "TABLE OF CONTENTS" ||
        trimmed === "WELCOME TO THE ARENA"
    ) {
        return "header";
    }

    if (
        /^[A-Z0-9_ \/.\-']+$/.test(trimmed) &&
        trimmed.length > 0 &&
        trimmed.length < 110 &&
        !trimmed.includes("=") &&
        !trimmed.includes("{") &&
        !trimmed.includes("}")
    ) {
        return "header";
    }

    if (
        trimmed.startsWith("//")
    ) {
        return "comment";
    }

    if (
        trimmed.endsWith("{") ||
        trimmed === "}" ||
        trimmed.startsWith("project ") ||
        trimmed.startsWith("mode ") ||
        trimmed.startsWith("world_") ||
        trimmed.startsWith("world ") ||
        trimmed.startsWith("system_") ||
        trimmed.startsWith("HEX_") ||
        trimmed.startsWith("active_") ||
        trimmed.startsWith("menu_")
    ) {
        return "subheader";
    }

    if (
        trimmed.includes("=") &&
        !trimmed.startsWith("===")
    ) {
        return "key";
    }

    if (
        trimmed.startsWith("SYSTEM_BOOT") ||
        trimmed.startsWith("system_status")
    ) {
        return "system";
    }

    return "";
}

function render(text, showCursor = true) {
    const lines = text.split("\n");

    codeElement.innerHTML = lines.map((line) => {
        const type = classifyLine(line);
        return '<span class="line ' + type + '">' + escapeHtml(line) + '</span>';
    }).join("");

    if (showCursor) {
        const cursorLine = document.createElement("span");
        cursorLine.className = "line";

        const cursor = document.createElement("span");
        cursor.id = "cursor";
        cursor.textContent = "|";

        cursorLine.appendChild(cursor);
        codeElement.appendChild(cursorLine);
    }
}

function typingStep() {
    if (finished) return;

    if (index >= source.length) {
        finishTyping();
        return;
    }

    index = Math.min(index + charsPerStep, source.length);
    render(source.slice(0, index), true);

    timer = setTimeout(typingStep, stepDelayMs);
}

function finishTyping() {
    finished = true;

    if (timer) {
        clearTimeout(timer);
    }

    index = source.length;
    render(source, false);

    statusElement.textContent = "HEXCORE GAMING // PROJECT FILE LOADED";
    skipButton.textContent = "FILE LOADED";
    skipButton.disabled = true;
}

skipButton.addEventListener("click", finishTyping);

render("", true);

setTimeout(() => {
    statusElement.textContent = "HEXCORE GAMING // LOADING CYBER_ARENA HEX//BREAK...";
    typingStep();
}, 250);
</script>
