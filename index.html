========================================================================================================================
PROJECT OVERVIEW
========================================================================================================================

project Cyber_Arena_HEX_BREAK {

    title = "Cyber_Arena HEX//BREAK"
    genre = "Fast, skill-based arena FPS"
    engine = "Unreal Engine"
    development_style = "Blueprint-focused"
    primary_mode = "HEX//BREAK"

    overview {

        Cyber_Arena HEX//BREAK is a fast, skill-based arena FPS built around extreme movement,
        local-gravity traversal, aggressive combat, and the HEX//BREAK objective mode.

        The game blends cyberpunk technology, fantasy, medieval influences, magical energy,
        gladiatorial aesthetics, and cosmic science fiction into a competitive arena setting
        where Human and Elven gladiators fight for the entertainment of massive cosmic beings.

        Cyber_Arena HEX//BREAK is being built in Unreal Engine as a Blueprint-focused project
        with a strong emphasis on player skill rather than automated assistance.

        The core idea is that mastering movement, positioning, weapons, gadgets, abilities,
        personal gravity, objective strategy, and the arena itself should determine who wins.

    }

    skill_philosophy {

        aim_assist = DISABLED
        auto_kill_system = DISABLED
        poor_aim_compensation = DISABLED
        poor_movement_compensation = DISABLED

        mastery_requires {

            aim
            movement
            positioning
            weapons
            gadgets
            abilities
            personal_gravity
            objective_control
            arena_knowledge
            timing
            decision_making
            execution

        }

        rule {

            Victory is meant to come from understanding and mastering the game.

            The game should not play itself for the player.

            Better mastery of the game's systems should create a real advantage.

        }

    }

}

========================================================================================================================
CORE MOVEMENT PHILOSOPHY
========================================================================================================================

movement_system {

    movement_speed = HIGH
    standard_sprint = REMOVED
    chained_movement = ENCOURAGED
    traditional_slow_navigation = REJECTED

    philosophy {

        Movement is one of the defining features of Cyber_Arena HEX//BREAK.

        Players move extremely quickly and are intended to chain movement together aggressively
        rather than slowly navigate traditional FPS maps.

        The game is built around maintaining momentum while attacking, escaping, pursuing,
        intercepting, repositioning, defending, and chasing the Hexcore.

    }

    base_movement {

        high_speed_running
        jumping
        crouching
        sliding
        vaulting
        mantling
        wall_running
        upward_wall_climbing
        wall_jumping
        wall_top_mantling
        movement_gadgets

    }

    sprint {

        normal_sprint_system = REMOVED

        Base movement is substantially faster instead.

        Speed is meant to be part of the default movement language rather than
        something constantly toggled on and off.

        future_optional_sprint_gadget = POSSIBLE

    }

}

========================================================================================================================
PERSONAL GRAVITY / EVERY-SURFACE MOVEMENT
========================================================================================================================

gravity_system {

    type = "Surface-relative personal gravity"
    universal_world_up = FALSE
    player_down = "Current registered floor surface"

    sequence {

        Current_Floor_Surface
            |
            v
        Surface_Normal
            |
            v
        Personal_Gravity
            |
            v
        Character_Orientation
            |
            v
        Camera_Orientation

    }

    basic_rule {

        normal_floor {

            floor = DOWN

        }

        wall {

            wall = DOWN

        }

        ceiling {

            ceiling = DOWN

        }

        From the player's perspective, they remain upright.

    }

    multiplayer_example {

        player_A = "Standing on a normal floor"
        player_B = "Running along a vertical wall"
        player_C = "Running upside down across the ceiling"

        result {

            All three players experience their own surface as down.

            All three can fight each other normally.

            All three operate from different personal gravity orientations.

        }

    }

    attachment {

        held_button_required = FALSE
        persists_after_valid_contact = TRUE

        Once attached to a valid surface, attachment persists automatically.

    }

    changing_surfaces {

        step_01 = "Leave the existing surface"
        step_02 = "Travel away from it"
        step_03 = "Physically contact another valid surface"

        passing_near_surface_changes_gravity = FALSE

    }

    transfer_example {

        Player_leaves_Surface_A
            |
            v
        Surface_A_gravity_remains_active
            |
            v
        Player_travels_through_space
            |
            v
        Player_contacts_Surface_B
            |
            v
        Surface_B_becomes_new_floor

    }

    missed_surface_behavior {

        If the player misses every surface, they continue falling according
        to the previous gravity frame.

        automatic_return_to_world_down = FALSE

    }

    curved_surfaces {

        continuous_surface_normal_updates = TRUE

        examples {

            spheres
            curved_tunnels
            rounded_tracks
            continuous_loops

        }

    }

    hard_edges {

        automatic_corner_wrapping = FALSE

        A cube does not automatically pull the player around its corner.

        The player must physically leave one face and establish contact
        with the next valid face.

    }

}

<script>

const sourceElement = document.getElementById("source");
const codeElement = document.getElementById("code");
const skipButton = document.getElementById("skip");
const statusElement = document.getElementById("status");

const source = sourceElement.textContent.replace(/^\n/, "");

let index = 0;
let finished = false;
let timer = null;

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function classifyLine(line) {

    const trimmed = line.trim();

    if (
        trimmed.startsWith("====") ||
        trimmed === "TABLE OF CONTENTS" ||
        trimmed === "SYSTEM STATUS" ||
        trimmed === "END OF PROJECT FILE"
    ) {
        return "header";
    }

    if (
        /^[A-Z0-9][A-Z0-9 \/&\-']+$/.test(trimmed) &&
        trimmed.length < 90
    ) {
        return "header";
    }

    if (
        trimmed.endsWith("{") ||
        trimmed === "}" ||
        trimmed.startsWith("project ") ||
        trimmed.startsWith("mode ") ||
        trimmed.startsWith("world ") ||
        trimmed.startsWith("creation_system ") ||
        trimmed.startsWith("development ")
    ) {
        return "subheader";
    }

    if (
        trimmed.includes("=") &&
        !trimmed.includes("====")
    ) {
        return "key";
    }

    if (
        trimmed.startsWith("SYSTEM") ||
        trimmed.startsWith("STATUS") ||
        trimmed.startsWith("INITIALIZING") ||
        trimmed.startsWith("CALIBRATING") ||
        trimmed.startsWith("LOADING") ||
        trimmed.startsWith("VERIFYING")
    ) {
        return "system";
    }

    return "";
}

function render(text, showCursor = true) {

    const lines = text.split("\n");

    codeElement.innerHTML = lines.map((line) => {

        const type = classifyLine(line);
        const safe = escapeHtml(line);

        return '<span class="line ' + type + '">' + safe + '</span>';

    }).join("");

    if (showCursor) {

        const cursorLine = document.createElement("span");
        cursorLine.className = "line";

        const cursor = document.createElement("span");
        cursor.id = "cursor";
        cursor.textContent = "|";

        cursorLine.appendChild(cursor);
        codeElement.appendChild(cursorLine);

    }

}

function typingStep() {

    if (finished) {
        return;
    }

    if (index >= source.length) {

        finishTyping();
        return;

    }

    let chunkSize = 9;

    const current = source[index];

    if (current === "\n") {
        chunkSize = 1;
    }

    index = Math.min(index + chunkSize, source.length);

    render(source.slice(0, index), true);

    if (index % 180 < chunkSize) {
        window.scrollTo(0, document.body.scrollHeight);
    }

    timer = setTimeout(typingStep, 4);

}

function finishTyping() {

    finished = true;

    if (timer) {
        clearTimeout(timer);
    }

    index = source.length;

    render(source, false);

    statusElement.textContent =
        "HEXCORE GAMING // READ ONLY PROJECT DATABASE // FILE LOADED";

    skipButton.textContent = "FILE LOADED";
    skipButton.disabled = true;

}

skipButton.addEventListener("click", finishTyping);

render("", true);

setTimeout(() => {

    statusElement.textContent =
        "HEXCORE GAMING // ACCESSING CYBER_ARENA HEX//BREAK...";

    typingStep();

}, 450);

</script>
